name: Multi Scraper BaratoRadar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"

jobs:
  scraper:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scraper:
          - zaffari
          - carrefour
          - atacadao

    name: Scraper ${{ matrix.scraper }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: npm run scrape:${{ matrix.scraper }}